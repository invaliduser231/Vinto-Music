name: vinto

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/invaliduser231/vinto-music:latest}
    pull_policy: always
    restart: unless-stopped
    mem_limit: ${APP_MEM_LIMIT:-3g}
    depends_on:
      nodelink:
        condition: service_started
      bgutil-pot:
        condition: service_started
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Falls back to the bundled mongo container. Set MONGODB_URI in .env to
      # use an external database instead.
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      NODELINK_ENABLED: ${NODELINK_ENABLED:-1}
      NODELINK_BASE_URL: ${NODELINK_BASE_URL:-http://nodelink:3000}
      MONITORING_ENABLED: ${MONITORING_ENABLED:-1}
      # Container internal values. The host side port is set under "ports".
      MONITORING_HOST: 0.0.0.0
      MONITORING_PORT: "9091"
      FFMPEG_BIN: /usr/bin/ffmpeg
      YTDLP_BIN: /usr/local/bin/yt-dlp
      YTDLP_EXTRA_ARGS: ${YTDLP_EXTRA_ARGS:---plugin-dirs,/etc/yt-dlp/plugins,--js-runtimes,node,--remote-components,ejs:github,--extractor-args,youtubepot-bgutilhttp:base_url=http://bgutil-pot:4416}
    ports:
      - "127.0.0.1:${MONITORING_PORT:-9091}:9091"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('node:http').get({host:'127.0.0.1',port:9091,path:'/readyz'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  nodelink:
    image: ${NODELINK_IMAGE:-ghcr.io/invaliduser231/nodelink:dev}
    pull_policy: always
    restart: unless-stopped
    mem_limit: ${NODELINK_MEM_LIMIT:-4g}
    depends_on:
      yt-cipher:
        condition: service_started
    expose:
      - "3000"
    environment:
      NODELINK_SERVER_HOST: 0.0.0.0
      NODELINK_SERVER_PORT: "3000"
      NODELINK_SERVER_PASSWORD: ${NODELINK_PASSWORD:?NODELINK_PASSWORD is required}
      NODELINK_CLUSTER_ENABLED: "true"
      NODELINK_API_ENABLELOADSTREAMENDPOINT: "true"
      NODELINK_API_ENABLETRACKSTREAMENDPOINT: "false"
      NODELINK_SEARCH_MAXRESULTS: ${NODELINK_SEARCH_MAXRESULTS:-10}
      NODELINK_PLAYBACK_MAXPLAYLISTLENGTH: ${NODELINK_PLAYBACK_MAXPLAYLISTLENGTH:-100}
      NODELINK_SOURCES_SPOTIFY_ENABLED: "true"
      NODELINK_SOURCES_SPOTIFY_CLIENTID: ${SPOTIFY_CLIENT_ID:-}
      NODELINK_SOURCES_SPOTIFY_CLIENTSECRET: ${SPOTIFY_CLIENT_SECRET:-}
      NODELINK_SOURCES_SPOTIFY_MARKET: ${SPOTIFY_MARKET:-US}
      NODELINK_SOURCES_DEEZER_ENABLED: "true"
      NODELINK_SOURCES_DEEZER_ARL: ${DEEZER_ARL:-}
      NODELINK_SOURCES_DEEZER_DECRYPTIONKEY: ${NODELINK_SOURCES_DEEZER_DECRYPTIONKEY:-}
      NODELINK_SOURCES_SPOTIFY_EXTERNALAUTHURL: ${NODELINK_SOURCES_SPOTIFY_EXTERNALAUTHURL:-http://get.1lucas1apk.fun/spotify/gettoken}
      NODELINK_SOURCES_PANDORA_REMOTETOKENURL: ${NODELINK_SOURCES_PANDORA_REMOTETOKENURL:-https://get.1lucas1apk.fun/pandora/gettoken}
      NODELINK_SOURCES_ETERNALBOX_BASEURL: ${NODELINK_SOURCES_ETERNALBOX_BASEURL:-https://eternalboxmirror.xyz}
      NODELINK_PLAYBACK_SPONSORBLOCK_API: ${NODELINK_PLAYBACK_SPONSORBLOCK_API:-https://sponsor.ajay.app}
      NODELINK_SOURCES_APPLEMUSIC_MEDIAAPITOKEN: ${APPLE_MUSIC_MEDIA_API_TOKEN:-}
      NODELINK_SOURCES_APPLEMUSIC_MARKET: ${APPLE_MUSIC_MARKET:-US}
      NODELINK_SOURCES_TIDAL_TOKEN: ${TIDAL_TOKEN:-}
      NODELINK_SOURCES_TIDAL_COUNTRYCODE: ${TIDAL_COUNTRY_CODE:-US}
      NODELINK_SOURCES_SOUNDCLOUD_ENABLED: "true"
      NODELINK_SOURCES_YOUTUBE_ENABLED: "true"
      NODELINK_SOURCES_YOUTUBE_CIPHER_URL: ${NODELINK_SOURCES_YOUTUBE_CIPHER_URL:-http://yt-cipher:8001}
      NODELINK_SOURCES_YOUTUBE_CLIENTS_PLAYBACK: ${NODELINK_SOURCES_YOUTUBE_CLIENTS_PLAYBACK:-["VisionOs","TV_DOWN","TV","WebEmbedded","IOS","Web"]}
      NODELINK_SOURCES_YOUTUBE_CLIENTS_RESOLVE: ${NODELINK_SOURCES_YOUTUBE_CLIENTS_RESOLVE:-["VisionOs","TV_DOWN","TV","WebEmbedded","IOS","Web"]}
      NODELINK_SOURCES_YOUTUBE_CLIENTS_SEARCH: ${NODELINK_SOURCES_YOUTUBE_CLIENTS_SEARCH:-["Android"]}
      NODELINK_SOURCES_YOUTUBE_PROXIES: ${NODELINK_SOURCES_YOUTUBE_PROXIES:-[]}
      NODELINK_SOURCES_YOUTUBE_CLIENTS_SETTINGS_TV_REFRESHTOKEN: ${NODELINK_SOURCES_YOUTUBE_CLIENTS_SETTINGS_TV_REFRESHTOKEN:-[]}
      NODELINK_SOURCES_YOUTUBE_GETOAUTHTOKEN: ${NODELINK_SOURCES_YOUTUBE_GETOAUTHTOKEN:-false}
      NODELINK_LOGGING_LEVEL: ${NODELINK_LOGGING_LEVEL:-info}
      NODELINK_SEARCH_DEFAULTSOURCE: ${NODELINK_SEARCH_DEFAULTSOURCE:-deezer,soundcloud,tidal,jiosaavn}
      NODELINK_SEARCH_UNIFIEDSOURCES: ${NODELINK_SEARCH_UNIFIEDSOURCES:-deezer,soundcloud,tidal,jiosaavn}
      NODELINK_SOURCES_YOUTUBE_FALLBACKSOURCES: ${NODELINK_SOURCES_YOUTUBE_FALLBACKSOURCES:-soundcloud,deezer,jiosaavn,tidal}
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('node:http').get({host:'127.0.0.1',port:3000,path:'/version',headers:{authorization:process.env.NODELINK_SERVER_PASSWORD}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 45s

  # Only started with "--profile bundled-db". Point MONGODB_URI at your own
  # database and leave the profile off, then this container never runs. An
  # idle bundled Mongo still costs CPU over time while doing nothing.
  mongo:
    profiles: ["bundled-db"]
    image: mongo:7
    restart: unless-stopped
    command: ["--bind_ip", "127.0.0.1,mongo"]
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-fluxer_music_bot}
    volumes:
      - mongo_data:/data/db
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host 127.0.0.1 --eval \"quit(db.adminCommand({ping:1}).ok?0:1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  bgutil-pot:
    image: ${BGUTIL_POT_PROVIDER_IMAGE:-brainicism/bgutil-ytdlp-pot-provider:1.3.1-node}
    restart: unless-stopped
    mem_limit: ${BGUTIL_POT_MEM_LIMIT:-384m}
    expose:
      - "4416"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  yt-cipher:
    image: ${YT_CIPHER_IMAGE:-ghcr.io/kikkia/yt-cipher:master}
    pull_policy: always
    restart: unless-stopped
    mem_limit: ${YT_CIPHER_MEM_LIMIT:-512m}
    expose:
      - "8001"
    environment:
      PORT: "8001"
      HOST: 0.0.0.0
      MAX_THREADS: ${YT_CIPHER_MAX_THREADS:-2}
      PREPROCESSED_CACHE_SIZE: ${YT_CIPHER_CACHE_SIZE:-150}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongo_data:
