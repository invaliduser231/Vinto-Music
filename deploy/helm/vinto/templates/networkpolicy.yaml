{{- if .Values.networkPolicy.enabled }}
{{- $root := . }}
{{- $fullname := include "vinto.fullname" . }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-app
  labels:
    {{- include "vinto.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vinto.selectorLabels" (dict "root" . "component" "app") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- if .Values.dashboard.enabled }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "vinto.selectorLabels" (dict "root" . "component" "dashboard") | nindent 14 }}
      ports:
        - port: dashboard-api
    {{- end }}
    {{- with .Values.networkPolicy.monitoringFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: monitoring
    {{- end }}
{{- $peers := dict "nodelink" "app" }}
{{- if .Values.ytCipher.enabled }}
{{- $_ := set $peers "yt-cipher" "nodelink" }}
{{- end }}
{{- if .Values.bgutilPot.enabled }}
{{- $_ := set $peers "bgutil-pot" "app" }}
{{- end }}
{{- range $component, $peer := $peers }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-{{ $component }}
  labels:
    {{- include "vinto.labels" $root | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vinto.selectorLabels" (dict "root" $root "component" $component) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "vinto.selectorLabels" (dict "root" $root "component" $peer) | nindent 14 }}
      ports:
        - port: http
{{- end }}
{{- end }}
